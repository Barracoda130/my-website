name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: ci-secret-key-change-me-with-long-randomized-value-1234567890
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: sqlite:///db.sqlite3
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      CSRF_TRUSTED_ORIGINS: http://localhost:5173
      SESSION_COOKIE_SECURE: "False"
      CSRF_COOKIE_SECURE: "False"
      SESSION_COOKIE_SAMESITE: Lax
      CSRF_COOKIE_SAMESITE: Lax
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate production settings
        env:
          DJANGO_DEBUG: "False"
          DJANGO_SECURE_PROXY_SSL_HEADER: "True"
          DJANGO_SECURE_SSL_REDIRECT: "True"
          DJANGO_SECURE_HSTS_SECONDS: "3600"
          DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"
          DJANGO_SECURE_HSTS_PRELOAD: "True"
          SESSION_COOKIE_SECURE: "True"
          CSRF_COOKIE_SECURE: "True"
        run: python manage.py check --deploy --fail-level WARNING
      - name: Check migration files are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Validate migrations apply cleanly
        run: python manage.py migrate --noinput
      - name: Run backend tests
        run: python manage.py test accounts expenses

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        env:
          CI: "true"
        run: npm run test:run
      - name: Build
        env:
          VITE_API_BASE_URL: http://localhost:8000
        run: npm run build
